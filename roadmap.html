                    <div className="bg-[#F7F1E8] border border-[#C1714F]/40 w-full max-w-lg rounded-2xl p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto text-[#3B1F10]">
                        <button onClick={onClose} className="absolute top-4 right-4 text-[#5C2A14] hover:text-[#3B1F10]">
                            <i className="fa-solid fa-xmark text-lg"></i>
                        </button>

                        <h3 className="font-extrabold text-lg text-[#3B1F10] mb-4 flex items-center gap-2">
                            <i className="fa-solid fa-book-open text-[#C1714F]"></i>
                            {item?.id ? 'Edit Curriculum Event' : 'Add Curriculum Event / Module'}
                        </h3>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-[#5C2A14] mb-1">Workshop Track *</label>
                                <select 
                                    value={track}
                                    onChange={(e) => setTrack(e.target.value)}
                                    className="w-full bg-white border border-[#CFA07E] rounded-xl px-3 py-2 text-xs font-bold text-[#3B1F10] focus:outline-none"
                                >
                                    <option value="homelabs">HomeLabs ("It's All Connected")</option>
                                    <option value="conferences">Conferences & Speaking</option>
                                    <option value="mentorship">Mentorship & Intern Pathways</option>
                                </select>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-[#5C2A14] mb-1">Module / Event Title *</label>
                                <input 
                                    type="text" 
                                    required
                                    value={title}
                                    onChange={(e) => setTitle(e.target.value)}
                                    placeholder="e.g. ISO Boot Media & Linux Administration"
                                    className="w-full bg-white border border-[#CFA07E] rounded-xl px-3 py-2 text-sm text-[#3B1F10] focus:outline-none focus:border-[#C1714F]"
                                />
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-bold text-[#5C2A14] mb-1">Subtitle / Module Tag</label>
                                    <input 
                                        type="text" 
                                        value={subtitle}
                                        onChange={(e) => setSubtitle(e.target.value)}
                                        placeholder="e.g. Module 4, Panel Session"
                                        className="w-full bg-white border border-[#CFA07E] rounded-xl px-3 py-2 text-xs text-[#3B1F10] focus:outline-none focus:border-[#C1714F]"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-[#5C2A14] mb-1">Target Date / Session</label>
                                    <input 
                                        type="date" 
                                        value={date}
                                        onChange={(e) => setDate(e.target.value)}
                                        className="w-full bg-white border border-[#CFA07E] rounded-xl px-3 py-2 text-xs text-[#3B1F10] focus:outline-none focus:border-[#C1714F]"
                                    />
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-[#5C2A14] mb-1">Owner / Lead Facilitator</label>
                                <select 
                                    value={facilitator}
                                    onChange={(e) => setFacilitator(e.target.value)}
                                    className="w-full bg-white border border-[#CFA07E] rounded-xl px-3 py-2 text-xs text-[#3B1F10] focus:outline-none"
                                >
                                    {teamOwners.map(o => <option key={o} value={o}>{o}</option>)}
                                </select>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-[#5C2A14] mb-1">Description & Topic Syllabus</label>
                                <textarea 
                                    rows="3"
                                    value={description}
                                    onChange={(e) => setDescription(e.target.value)}
                                    placeholder="Detail curriculum topics, hardware needed, slides, guest panelists..."
                                    className="w-full bg-white border border-[#CFA07E] rounded-xl px-3 py-2 text-xs text-[#3B1F10] focus:outline-none focus:border-[#C1714F]"
                                ></textarea>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-[#5C2A14] mb-1">Target Learning Outcome / Deliverable</label>
                                <input 
                                    type="text" 
                                    value={outcome}
                                    onChange={(e) => setOutcome(e.target.value)}
                                    placeholder="e.g. Students deploy Proxmox server and ISO container"
                                    className="w-full bg-white border border-[#CFA07E] rounded-xl px-3 py-2 text-xs text-[#3B1F10] focus:outline-none focus:border-[#C1714F]"
                                />
                            </div>

                            <div className="flex items-center justify-between pt-4 border-t border-[#E0C9AA]">
                                {item?.id ? (
                                    <ConfirmDeleteButton onConfirm={() => onDelete(item.id)} />
                                ) : (
                                    <div></div>
                                )}

                                <div className="flex items-center space-x-2">
                                    <button 
                                        type="button"
                                        onClick={onClose}
                                        className="bg-[#E8D4BC] hover:bg-[#E0C9AA] text-[#3B1F10] text-xs font-bold px-4 py-2 rounded-xl transition border border-[#CFA07E]"
                                    >
                                        Cancel
                                    </button>
                                    <button 
                                        type="submit"
                                        className="bg-[#C1714F] hover:bg-[#A85A38] text-white text-xs font-bold px-5 py-2 rounded-xl transition shadow-md"
                                    >
                                        Save Curriculum Event
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function GrantModal({ grant, onSave, onDelete, onClose }) {
            useEscapeToClose(onClose);
            const [organization, setOrganization] = useState(grant?.organization || '');
            const [link, setLink] = useState(grant?.link || '');
            const [amount, setAmount] = useState(grant?.amount || '');
            const [eligibility, setEligibility] = useState(grant?.eligibility || '');
            const [deadline, setDeadline] = useState(grant?.deadline || '');
            const [status, setStatus] = useState(grant?.status || 'In Progress');
            const [date, setDate] = useState(grant?.date || toLocalISODate());
            const [notes, setNotes] = useState(grant?.notes || '');
            const [initials, setInitials] = useState(grant?.initials || 'SL');

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!organization.trim()) return;
                onSave({
                    organization,
                    link,
                    amount: Number(amount) || 0,
                    eligibility,
                    deadline,
                    status,
                    date,
                    notes,
                    initials
                });
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#3B1F10]/50 backdrop-blur-sm">
                    <div className="bg-[#F7F1E8] border border-[#C1714F]/40 w-full max-w-lg rounded-2xl p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto text-[#3B1F10]">
                        <button onClick={onClose} className="absolute top-4 right-4 text-[#5C2A14] hover:text-[#3B1F10]">
                            <i className="fa-solid fa-xmark text-lg"></i>
                        </button>

                        <h3 className="font-extrabold text-lg text-[#3B1F10] mb-4 flex items-center gap-2">
                            <i className="fa-solid fa-hand-holding-dollar text-[#C1714F]"></i>
                            {grant?.id ? 'Edit Grant Entry' : 'Add Grant Application Entry'}
                        </h3>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-[#5C2A14] mb-1">Organization / Grantor *</label>
                                <input 
                                    type="text" 
                                    required
                                    value={organization}
                                    onChange={(e) => setOrganization(e.target.value)}
                                    placeholder="e.g. AWS Imagine Grant"
                                    className="w-full bg-white border border-[#CFA07E] rounded-xl px-3 py-2 text-sm text-[#3B1F10] focus:outline-none focus:border-[#C1714F]"
                                />
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-bold text-[#5C2A14] mb-1">Grantor Link</label>
                                    <input 
                                        type="url" 
                                        value={link}
                                        onChange={(e) => setLink(e.target.value)}
                                        placeholder="https://..."
                                        className="w-full bg-white border border-[#CFA07E] rounded-xl px-3 py-2 text-xs text-[#3B1F10] focus:outline-none focus:border-[#C1714F]"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-[#5C2A14] mb-1">Amount ($)</label>
                                    <input 
                                        type="number" 
                                        value={amount}
                                        onChange={(e) => setAmount(e.target.value)}
                                        placeholder="25000"
                                        className="w-full bg-white border border-[#CFA07E] rounded-xl px-3 py-2 text-xs text-[#3B1F10] focus:outline-none focus:border-[#C1714F]"
                                    />
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-bold text-[#5C2A14] mb-1">Deadline (if applicable)</label>
                                    <input 
                                        type="date" 
                                        value={deadline}
                                        onChange={(e) => setDeadline(e.target.value)}
                                        className="w-full bg-white border border-[#CFA07E] rounded-xl px-3 py-2 text-xs text-[#3B1F10] focus:outline-none focus:border-[#C1714F]"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-[#5C2A14] mb-1">Status</label>
                                    <select 
                                        value={status}
                                        onChange={(e) => setStatus(e.target.value)}
                                        className="w-full bg-white border border-[#CFA07E] rounded-xl px-2.5 py-2 text-xs text-[#3B1F10] focus:outline-none"
                                    >
                                        <option value="Drafting">Drafting</option>
                                        <option value="In Progress">In Progress</option>
                                        <option value="Submitted">Submitted</option>
                                        <option value="Under Review">Under Review</option>
                                        <option value="Awarded">Awarded</option>
                                        <option value="Declined">Declined</option>
                                    </select>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-bold text-[#5C2A14] mb-1">Eligibility Criteria</label>
                                    <input 
                                        type="text" 
                                        value={eligibility}
                                        onChange={(e) => setEligibility(e.target.value)}
                                        placeholder="501c3 tech focus"
                                        className="w-full bg-white border border-[#CFA07E] rounded-xl px-3 py-2 text-xs text-[#3B1F10] focus:outline-none focus:border-[#C1714F]"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-[#5C2A14] mb-1">Initials (Owner)</label>
                                    <input 
                                        type="text" 
                                        value={initials}
                                        onChange={(e) => setInitials(e.target.value)}
                                        placeholder="GL, SB, MW"
                                        className="w-full bg-white border border-[#CFA07E] rounded-xl px-3 py-2 text-xs text-[#3B1F10] focus:outline-none focus:border-[#C1714F]"
                                    />
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-[#5C2A14] mb-1">Notes / Next Steps</label>
                                <textarea 
                                    rows="3"
                                    value={notes}
                                    onChange={(e) => setNotes(e.target.value)}
                                    placeholder="Enter application progress, impact stories attached, review dates..."
                                    className="w-full bg-white border border-[#CFA07E] rounded-xl px-3 py-2 text-xs text-[#3B1F10] focus:outline-none focus:border-[#C1714F]"
                                ></textarea>
                            </div>

                            <div className="flex items-center justify-between pt-4 border-t border-[#E0C9AA]">
                                {grant?.id ? (
                                    <ConfirmDeleteButton onConfirm={() => onDelete(grant.id)} />
                                ) : (
                                    <div></div>
                                )}

                                <div className="flex items-center space-x-2">
                                    <button 
                                        type="button"
                                        onClick={onClose}
                                        className="bg-[#E8D4BC] hover:bg-[#E0C9AA] text-[#3B1F10] text-xs font-bold px-4 py-2 rounded-xl transition border border-[#CFA07E]"
                                    >
                                        Cancel
                                    </button>
                                    <button 
                                        type="submit"
                                        className="bg-[#C1714F] hover:bg-[#A85A38] text-white text-xs font-bold px-5 py-2 rounded-xl transition shadow-md"
                                    >
                                        Save Grant
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function BudgetModal({ item, onSave, onDelete, onClose }) {
            useEscapeToClose(onClose);
            const [budgetItem, setBudgetItem] = useState(item?.item || '');
            const [category, setCategory] = useState(item?.category || 'Marketing');
            const [amount, setAmount] = useState(item?.amount || '');
            const [status, setStatus] = useState(item?.status || 'Pending');
            const [notes, setNotes] = useState(item?.notes || '');

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!budgetItem.trim()) return;
                onSave({
                    item: budgetItem,
                    category,
                    amount: Number(amount) || 0,
                    status,
                    notes
                });
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#3B1F10]/50 backdrop-blur-sm">
                    <div className="bg-[#F7F1E8] border border-[#C1714F]/40 w-full max-w-md rounded-2xl p-6 shadow-2xl relative text-[#3B1F10]">
                        <button onClick={onClose} className="absolute top-4 right-4 text-[#5C2A14] hover:text-[#3B1F10]">
                            <i className="fa-solid fa-xmark text-lg"></i>
                        </button>

                        <h3 className="font-extrabold text-lg text-[#3B1F10] mb-4 flex items-center gap-2">
                            <i className="fa-solid fa-wallet text-[#C1714F]"></i>
                            {item?.id ? 'Edit Budget Line Item' : 'Add Budget Line Item'}
                        </h3>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-[#5C2A14] mb-1">Line Item Description *</label>
                                <input 
                                    type="text" 
                                    required
                                    value={budgetItem}
                                    onChange={(e) => setBudgetItem(e.target.value)}
                                    placeholder="e.g. SyeLabs Embroidered Caps & Swag"
                                    className="w-full bg-white border border-[#CFA07E] rounded-xl px-3 py-2 text-sm text-[#3B1F10] focus:outline-none focus:border-[#C1714F]"
                                />
                            </div>

                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-xs font-bold text-[#5C2A14] mb-1">Category</label>
                                    <select 
                                        value={category}
                                        onChange={(e) => setCategory(e.target.value)}
                                        className="w-full bg-white border border-[#CFA07E] rounded-xl px-2.5 py-2 text-xs text-[#3B1F10] focus:outline-none"
                                    >
                                        <option value="Legal & Org">Legal & Org</option>
                                        <option value="Marketing">Marketing</option>
                                        <option value="Conferences">Conferences</option>
                                        <option value="Programs">Programs</option>
                                        <option value="Scaling">Scaling</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-[#5C2A14] mb-1">Estimated Cost ($)</label>
                                    <input 
                                        type="number" 
                                        required
                                        value={amount}
                                        onChange={(e) => setAmount(e.target.value)}
                                        placeholder="1200"
                                        className="w-full bg-white border border-[#CFA07E] rounded-xl px-3 py-2 text-xs text-[#3B1F10] focus:outline-none focus:border-[#C1714F]"
                                    />
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-[#5C2A14] mb-1">Approval Status</label>
                                <select 
                                    value={status}
                                    onChange={(e) => setStatus(e.target.value)}
                                    className="w-full bg-white border border-[#CFA07E] rounded-xl px-2.5 py-2 text-xs text-[#3B1F10] focus:outline-none"
                                >
                                    <option value="Planned">Planned</option>
                                    <option value="Pending">Pending Approval</option>
                                    <option value="Approved">Approved</option>
                                </select>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-[#5C2A14] mb-1">Notes / Vendor Info</label>
                                <input 
                                    type="text" 
                                    value={notes}
                                    onChange={(e) => setNotes(e.target.value)}
                                    placeholder="Order quote details, lead times..."
                                    className="w-full bg-white border border-[#CFA07E] rounded-xl px-3 py-2 text-xs text-[#3B1F10] focus:outline-none focus:border-[#C1714F]"
                                />
                            </div>

                            <div className="flex items-center justify-between pt-4 border-t border-[#E0C9AA]">
                                {item?.id ? (
                                    <ConfirmDeleteButton onConfirm={() => onDelete(item.id)} />
                                ) : (
                                    <div></div>
                                )}

                                <div className="flex items-center space-x-2">
                                    <button 
                                        type="button"
                                        onClick={onClose}
                                        className="bg-[#E8D4BC] hover:bg-[#E0C9AA] text-[#3B1F10] text-xs font-bold px-4 py-2 rounded-xl transition border border-[#CFA07E]"
                                    >
                                        Cancel
                                    </button>
                                    <button 
                                        type="submit"
                                        className="bg-[#C1714F] hover:bg-[#A85A38] text-white text-xs font-bold px-5 py-2 rounded-xl transition shadow-md"
                                    >
                                        Save Line Item
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<SyeLabsApp />);
    </script>
</body>
</html>
