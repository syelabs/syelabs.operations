        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.SyeLabsFB = {
            db: null,
            auth: null,
            user: null,
            appId: typeof __app_id !== 'undefined' ? __app_id : 'syelabs-master-hub',
            init: async function(onReadyCallback) {
                try {
                    let firebaseConfig = {};
                    if (typeof __firebase_config !== 'undefined') {
                        firebaseConfig = JSON.parse(__firebase_config);
                    } else {
                        console.warn('Firebase config absent, running in local client storage mode.');
                        if (onReadyCallback) onReadyCallback(null);
                        return;
                    }

                    const app = initializeApp(firebaseConfig);
                    const db = getFirestore(app);
                    const auth = getAuth(app);
                    
                    window.SyeLabsFB.db = db;
                    window.SyeLabsFB.auth = auth;

                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }

                    onAuthStateChanged(auth, (usr) => {
                        window.SyeLabsFB.user = usr;
                        if (usr && onReadyCallback) {
                            onReadyCallback(usr);
                        }
                    });
                } catch (e) {
                    console.warn("Firebase init notice:", e.message || e);
                    if (onReadyCallback) onReadyCallback(null);
                }
            }
        };
    </script>

                            if (data.curriculumItems) setCurriculumItems(data.curriculumItems);
                            if (data.governance) setGovernance(data.governance);
                            if (data.totalBudgetCap !== undefined) setTotalBudgetCap(data.totalBudgetCap);
                            if (data.teamOwners) setTeamOwners(data.teamOwners);
                            try { localStorage.setItem(`syelabs_plan_${pId}`, JSON.stringify(data)); } catch(e){}
                        } else {
                            fs.setDoc(docRef, {
                                planTitle,
                                startDate,
                                events,
                                grants,
                                budgetItems,
                                curriculumItems,
                                governance,
                                totalBudgetCap,
                                teamOwners,
                                updatedAt: new Date().toISOString()
                            }).catch(err => console.warn("Firestore initial write notice:", err.message));
                        }
                    }, (err) => {
                        console.warn("Firestore snapshot unavailable (running in Local Storage mode):", err.message);
                        setSyncing(false);
                    });

                    return () => unsubscribe();
                }).catch(err => setSyncing(false));
            };

            const savePlanToCloud = async (updatedEvents, updatedGrants, updatedBudget, updatedCurriculum, newTitle, newStartDate, newBudgetCap, newOwners, updatedGovernance) => {
                const payload = {
                    planTitle: newTitle !== undefined ? newTitle : planTitle,
                    startDate: newStartDate !== undefined ? newStartDate : startDate,
                    events: updatedEvents !== undefined ? updatedEvents : events,
                    grants: updatedGrants !== undefined ? updatedGrants : grants,
                    budgetItems: updatedBudget !== undefined ? updatedBudget : budgetItems,
                    curriculumItems: updatedCurriculum !== undefined ? updatedCurriculum : curriculumItems,
                    governance: updatedGovernance !== undefined ? updatedGovernance : governance,
                    totalBudgetCap: newBudgetCap !== undefined ? newBudgetCap : totalBudgetCap,
                    teamOwners: newOwners !== undefined ? newOwners : teamOwners,
                    updatedAt: new Date().toISOString()
                };

                // Always persist locally
                try {
                    localStorage.setItem(`syelabs_plan_${planId}`, JSON.stringify(payload));
                } catch (e) {}

                const { db, appId, user } = window.SyeLabsFB;
                if (!db || !user) return;

                try {
                    setSyncing(true);
                    const fs = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                    const docRef = fs.doc(db, 'artifacts', appId, 'public_data', `plan_${planId}`);
                    await fs.setDoc(docRef, {
                        ...payload,
                        lastUpdatedBy: user.uid
                    }, { merge: true });
                } catch (e) {
                    console.warn("Cloud save notice (saved locally instead):", e.message || e);
                } finally {
                    setSyncing(false);
                }
            };

            const handleSaveGovernance = (newGov) => {
                setGovernance(newGov);
                savePlanToCloud(events, grants, budgetItems, curriculumItems, planTitle, startDate, totalBudgetCap, teamOwners, newGov);
                showToast('Governance Charter updated!', 'success');
                setIsGovernanceModalOpen(false);
            };

            const handleAddTeamOwner = (newOwner) => {
                if (!newOwner || teamOwners.includes(newOwner)) return;
                const updated = [...teamOwners, newOwner];
                setTeamOwners(updated);
                savePlanToCloud(events, grants, budgetItems, curriculumItems, planTitle, startDate, totalBudgetCap, updated);
                showToast(`New team owner "${newOwner}" added!`, 'success');
            };

            // Calculate current 3 displayed months for timeline
            const displayedTimelineMonths = useMemo(() => {
                const months = [];
                for (let i = 0; i < 3; i++) {
                    const d = new Date(timelineBaseDate.getFullYear(), timelineBaseDate.getMonth() + i, 1);
                    const yearMonthStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                    const label = d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
                    months.push({ date: d, yearMonthStr, label });
                }
                return months;
            }, [timelineBaseDate]);

            // Filtered events
            const filteredEvents = useMemo(() => {
                return events.filter(evt => {
                    const evtYearMonth = evt.date ? evt.date.substring(0, 7) : '';
                    const matchSearch = evt.title.toLowerCase().includes(filterSearch.toLowerCase()) || 
                                        (evt.description && evt.description.toLowerCase().includes(filterSearch.toLowerCase())) ||
                                        (evt.category && evt.category.toLowerCase().includes(filterSearch.toLowerCase()));
                    
                    const evtAssignees = evt.assignee ? evt.assignee.split(',').map(a => a.trim()) : [];
                    const matchAssignee = filterAssignee === 'All' || evtAssignees.includes(filterAssignee) || evt.assignee === filterAssignee;
                    const matchMonth = filterMonth === 'All' || evtYearMonth === filterMonth;
                    
                    return matchSearch && matchAssignee && matchMonth;
                });
            }, [events, filterSearch, filterAssignee, filterMonth]);

            const assigneesList = useMemo(() => {
                const list = new Set(teamOwners);
                events.forEach(e => {
                    if (e.assignee) {
                        e.assignee.split(',').forEach(a => list.add(a.trim()));
                    }
                });
                return ['All', ...Array.from(list)];
            }, [events, teamOwners]);

            const availableMonthsList = useMemo(() => {
                const set = new Set();
                events.forEach(e => {
                    if (e.date) set.add(e.date.substring(0, 7));
                });
                const arr = Array.from(set).sort();
                return arr.map(ym => {
                    const [y, m] = ym.split('-');
                    const dateObj = new Date(Number(y), Number(m) - 1, 1);
                    return {
                        value: ym,
                        label: dateObj.toLocaleDateString('en-US', { month: 'short', year: 'numeric' })
                    };
                });
            }, [events]);

            // Budget calculations
            const totalCostsOverall = useMemo(() => {
                return budgetItems.reduce((acc, b) => acc + (Number(b.amount) || 0), 0);
            }, [budgetItems]);

            const totalRemainingBudget = useMemo(() => {
                return totalBudgetCap - totalCostsOverall;
            }, [totalBudgetCap, totalCostsOverall]);

            const handleSaveEvent = (eventData) => {
                let updated;
                if (editingEvent && editingEvent.id) {
                    updated = events.map(e => e.id === editingEvent.id ? { ...editingEvent, ...eventData } : e);
                    showToast('Milestone updated successfully!', 'success');
                } else {
                    const newEvt = { ...eventData, id: 'evt-' + Date.now() };
                    updated = [...events, newEvt];
                    showToast('New milestone added!', 'success');
                }
                setEvents(updated);
                savePlanToCloud(updated, grants, budgetItems, curriculumItems, planTitle, startDate, totalBudgetCap, teamOwners);
                setIsModalOpen(false);
                setEditingEvent(null);
            };

            const handleDeleteEvent = (id) => {
                const updated = events.filter(e => e.id !== id);
                setEvents(updated);
                savePlanToCloud(updated, grants, budgetItems, curriculumItems, planTitle, startDate, totalBudgetCap, teamOwners);
                showToast('Milestone removed', 'info');
                setIsModalOpen(false);
                setEditingEvent(null);
            };

            const handleSaveGrant = (grantData) => {
                let updated;
                if (editingGrant && editingGrant.id) {
                    updated = grants.map(g => g.id === editingGrant.id ? { ...editingGrant, ...grantData } : g);
                    showToast('Grant updated successfully!', 'success');
                } else {
                    const newG = { ...grantData, id: 'g-' + Date.now() };
                    updated = [...grants, newG];
                    showToast('New grant tracked!', 'success');
                }
                setGrants(updated);
                savePlanToCloud(events, updated, budgetItems, curriculumItems, planTitle, startDate, totalBudgetCap, teamOwners);
                setIsGrantModalOpen(false);
                setEditingGrant(null);
            };

            const handleDeleteGrant = (id) => {
                const updated = grants.filter(g => g.id !== id);
                setGrants(updated);
                savePlanToCloud(events, updated, budgetItems, curriculumItems, planTitle, startDate, totalBudgetCap, teamOwners);
                showToast('Grant removed', 'info');
                setIsGrantModalOpen(false);
                setEditingGrant(null);
            };

            const handleSaveBudget = (budgetData) => {
                let updated;
                if (editingBudget && editingBudget.id) {
                    updated = budgetItems.map(b => b.id === editingBudget.id ? { ...editingBudget, ...budgetData } : b);
                    showToast('Budget line item updated!', 'success');
                } else {
                    const newB = { ...budgetData, id: 'b-' + Date.now() };
                    updated = [...budgetItems, newB];
                    showToast('New budget item added!', 'success');
                }
                setBudgetItems(updated);
                savePlanToCloud(events, grants, updated, curriculumItems, planTitle, startDate, totalBudgetCap, teamOwners);
                setIsBudgetModalOpen(false);
                setEditingBudget(null);
            };

            const handleDeleteBudget = (id) => {
                const updated = budgetItems.filter(b => b.id !== id);
                setBudgetItems(updated);
                savePlanToCloud(events, grants, updated, curriculumItems, planTitle, startDate, totalBudgetCap, teamOwners);
                showToast('Budget item removed', 'info');
                setIsBudgetModalOpen(false);
                setEditingBudget(null);
            };

            const handleSaveCurriculum = (curriculumData) => {
                let updated;
                if (editingCurriculum && editingCurriculum.id) {
                    updated = curriculumItems.map(c => c.id === editingCurriculum.id ? { ...editingCurriculum, ...curriculumData } : c);
                    showToast('Curriculum item updated!', 'success');
                } else {
                    const newC = { ...curriculumData, id: 'curr-' + Date.now() };
                    updated = [...curriculumItems, newC];
                    showToast('New curriculum item added!', 'success');
                }
                setCurriculumItems(updated);
                savePlanToCloud(events, grants, budgetItems, updated, planTitle, startDate, totalBudgetCap, teamOwners);
                setIsCurriculumModalOpen(false);
                setEditingCurriculum(null);
            };

            const handleDeleteCurriculum = (id) => {
                const updated = curriculumItems.filter(c => c.id !== id);
                setCurriculumItems(updated);
                savePlanToCloud(events, grants, budgetItems, updated, planTitle, startDate, totalBudgetCap, teamOwners);
                showToast('Curriculum item removed', 'info');
                setIsCurriculumModalOpen(false);
                setEditingCurriculum(null);
            };

            const handleExportICS = () => {
                let icsContent = [
                    'BEGIN:VCALENDAR',
                    'VERSION:2.0',
                    'PRODID:-//SyeLabs//Roadmap Calendar//EN',
                    'CALSCALE:GREGORIAN',
                    'METHOD:PUBLISH'
                ];

                events.forEach(evt => {
                    const dateClean = evt.date ? evt.date.replace(/-/g, '') : '';
                    if (!dateClean) return;
                    icsContent.push('BEGIN:VEVENT');
                    icsContent.push(`UID:evt-${evt.id}@syelabs.com`);
                    icsContent.push(`DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z`);
                    icsContent.push(`DTSTART;VALUE=DATE:${dateClean}`);
                    icsContent.push(`SUMMARY:[SyeLabs] ${evt.title.replace(/,/g, '\\,')}`);
                    icsContent.push(`DESCRIPTION:Category: ${evt.category} | Owners: ${evt.assignee || 'Unassigned'} | Deliverable: ${evt.deliverable || 'N/A'}`);
                    icsContent.push('END:VEVENT');
                });

                icsContent.push('END:VCALENDAR');
                const blob = new Blob([icsContent.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
                const url = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.setAttribute('download', 'syelabs-roadmap.ics');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast('Calendar exported (.ics file)!', 'success');
            };

            return (
                <div class="min-h-screen pb-16">
                    {/* Toast notification */}
                    {toast && (
                        <div class={`fixed bottom-5 right-5 z-50 px-5 py-3 rounded-xl text-xs font-bold shadow-2xl flex items-center space-x-2 transition-all ${
                            toast.type === 'success' ? 'bg-[#C1714F] text-white' : 'bg-[#3B1F10] text-[#F7F1E8]'
                        }`}>
                            <i class={`fa-solid ${toast.type === 'success' ? 'fa-circle-check' : 'fa-circle-info'}`}></i>
                            <span>{toast.msg}</span>
                        </div>

                    {/* Top Branding Bar */}
                    <header class="bg-[#F2E8D9] border-b border-[#E0C9AA] sticky top-0 z-30 shadow-sm">

                            {/* Brand Logo and Title */}
                            <div class="flex items-center space-x-3">
                                <div class="w-11 h-11 rounded-2xl bg-[#3B1F10] flex items-center justify-center p-1.5 shadow-md shrink-0 border border-[#C1714F]">
                                    <img 
                                        src="https://syelabs.com/wp-content/uploads/2023/11/cropped-SyeLabs-Logo-1.png" 
                                        alt="SyeLabs Logo" 
                                        class="w-full h-full object-contain"
                                        onError={(e) => {
                                            e.target.onerror = null;
                                            e.target.style.display = 'none';
                                            e.target.parentNode.innerHTML = '<i class="fa-solid fa-vial-virus text-[#F2E8D9] text-xl"></i>';
                                        }}
                                    />
                                </div>

                                <div>
                                    <h1 class="syelabs-brand-heading leading-tight">SYELABS</h1>
                                    <p class="text-[11px] text-[#98573b] font-semibold tracking-wider uppercase">
                                        Continuous Strategic Roadmap & Operations Hub
                                    </p>
                                </div>
                            </div>

                            {/* Header Actions */}
                            <div class="flex items-center space-x-2 sm:space-x-3">
                                {syncing ? (
                                    <span class="text-xs text-[#98573b] font-bold flex items-center gap-1 bg-[#E8D4BC] px-2.5 py-1 rounded-lg">
                                        <i class="fa-solid fa-spinner fa-spin"></i> Syncing
                                    </span>
                                ) : (
                                    <span class="text-xs text-[#5C2A14] font-bold flex items-center gap-1 bg-[#E8D4BC]/60 px-2.5 py-1 rounded-lg border border-[#CFA07E]/40" title="All edits saved locally and synced when connected">
                                        <i class="fa-solid fa-hard-drive text-[#C1714F]"></i> Saved
                                    </span>
                                )}

                                <button 
                                    onClick={handleExportICS}
                                    class="bg-[#E8D4BC] hover:bg-[#E0C9AA] text-[#3B1F10] text-xs font-bold px-3.5 py-2 rounded-xl border border-[#CFA07E] transition flex items-center gap-1.5"
                                    title="Export Calendar to Google / Outlook"
                                >
                                    <i class="fa-solid fa-file-export text-[#C1714F]"></i> Export .ICS
                                </button>

                                <button 
                                    onClick={() => setIsShareModalOpen(true)}
                                    class="bg-[#C1714F] hover:bg-[#A85A38] text-white text-xs font-bold px-4 py-2 rounded-xl transition flex items-center gap-1.5 shadow-md shadow-[#C1714F]/20"
                                >
                                    <i class="fa-solid fa-share-nodes"></i> Share Room
                                </button>
                            </div>
                        </div>

                        {/* Navigation Tabs Bar */}
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center space-x-1 sm:space-x-2 overflow-x-auto py-2 border-t border-[#E0C9AA]/60">
                            <button 
                                onClick={() => setMainTab('plan')}
                                class={`px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 whitespace-nowrap ${
                                    mainTab === 'plan' ? 'bg-[#3B1F10] text-[#F7F1E8] shadow' : 'text-[#5C2A14] hover:bg-[#E8D4BC]/60'
                                }`}
                            >
                                <i class="fa-solid fa-calendar-days text-[#C1714F]"></i> Monthly Roadmap
                            </button>

                            <button 
                                onClick={() => setMainTab('grants')}
                                class={`px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 whitespace-nowrap ${
                                    mainTab === 'grants' ? 'bg-[#3B1F10] text-[#F7F1E8] shadow' : 'text-[#5C2A14] hover:bg-[#E8D4BC]/60'
                                }`}
                            >
                                <i class="fa-solid fa-wallet text-[#C1714F]"></i> Budget & Grants Ledger
                            </button>

                            <button 
                                onClick={() => setMainTab('governance')}
                                class={`px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 whitespace-nowrap ${
                                    mainTab === 'governance' ? 'bg-[#3B1F10] text-[#F7F1E8] shadow' : 'text-[#5C2A14] hover:bg-[#E8D4BC]/60'
                                }`}
                            >
                                <i class="fa-solid fa-landmark text-[#C1714F]"></i> Governance & Charter
                            </button>

                            <button 
                                onClick={() => setMainTab('curriculum')}
                                class={`px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 whitespace-nowrap ${
                                    mainTab === 'curriculum' ? 'bg-[#3B1F10] text-[#F7F1E8] shadow' : 'text-[#5C2A14] hover:bg-[#E8D4BC]/60'
                                }`}
                            >
                                <i class="fa-solid fa-book-open text-[#C1714F]"></i> Curriculum Workshop
                            </button>
                        </div>
                    </header>

                    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">

                        {}
                        {mainTab === 'plan' && (
                            <div class="space-y-6">
                                {/* Title & Start Date Bar */}
                                <div class="glass-panel p-5 sm:p-6 rounded-2xl flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                                    <div>
                                        <input 
                                            type="text" 
                                            value={planTitle} 
                                            onChange={(e) => {
                                                setPlanTitle(e.target.value);
                                                savePlanToCloud(events, grants, budgetItems, curriculumItems, e.target.value, startDate, totalBudgetCap, teamOwners);
                                            }}
                                            class="text-xl sm:text-2xl font-extrabold text-[#3B1F10] bg-transparent border-b border-transparent hover:border-[#C1714F] focus:border-[#C1714F] focus:outline-none w-full"
                                        />
                                        <p class="text-xs text-[#5C2A14] font-semibold mt-1">
                                            Multi-month strategic milestone planner built for long-term SyeLabs growth, advisors & mentors
                                        </p>
                                    </div>

                                    <div class="flex items-center space-x-3 shrink-0">
                                        <div class="text-right">
                                            <label class="block text-[11px] font-extrabold text-[#5C2A14] uppercase">Plan Launch Date</label>
                                            <input 
                                                type="date" 
                                                value={startDate} 
                                                onChange={(e) => {
                                                    setStartDate(e.target.value);
                                                    savePlanToCloud(events, grants, budgetItems, curriculumItems, planTitle, e.target.value, totalBudgetCap, teamOwners);
                                                }}
                                                class="bg-white border border-[#CFA07E] text-[#3B1F10] text-xs font-bold rounded-xl px-3 py-1.5 focus:outline-none focus:border-[#C1714F] cursor-pointer shadow-sm"
                                            />
                                        </div>

                                        <button 
                                            onClick={() => {
                                                setEditingEvent(null);
                                                setIsModalOpen(true);
                                            }}
                                            class="bg-[#C1714F] hover:bg-[#A85A38] text-white text-xs font-bold px-4 py-2.5 rounded-xl transition flex items-center gap-2 shadow-md"
                                        >
                                            <i class="fa-solid fa-plus"></i> Add Task / Milestone
                                        </button>
                                    </div>
                                </div>

                                {/* Filters, Timeline Month Nav, and View Switcher */}
                                <div class="glass-panel p-4 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-4">
                                    <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                                        {/* Search */}
                                        <div class="relative flex-1 sm:flex-initial min-w-[180px]">
                                            <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-[#98573b]"></i>
                                            <input 
                                                type="text" 
                                                placeholder="Search milestones or tags..." 
                                                value={filterSearch}
                                                onChange={(e) => setFilterSearch(e.target.value)}
                                                class="w-full bg-white border border-[#CFA07E] rounded-xl pl-8 pr-3 py-1.5 text-xs text-[#3B1F10] focus:outline-none focus:border-[#C1714F]"
                                            />
                                        </div>

                                        {/* Assignee / Owner Filter */}
                                        <select 
                                            value={filterAssignee}
                                            onChange={(e) => setFilterAssignee(e.target.value)}
                                            class="bg-white border border-[#CFA07E] rounded-xl px-3 py-1.5 text-xs text-[#3B1F10] font-bold focus:outline-none"
                                        >
                                            {assigneesList.map(a => <option key={a} value={a}>Owner: {a}</option>)}
                                        </select>

                                        {/* Month Filter */}
                                        <select 
                                            value={filterMonth}
                                            onChange={(e) => setFilterMonth(e.target.value)}
                                            class="bg-white border border-[#CFA07E] rounded-xl px-3 py-1.5 text-xs text-[#3B1F10] font-bold focus:outline-none"
                                        >
                                            <option value="All">All Months</option>
                                            {availableMonthsList.map(m => (
                                                <option key={m.value} value={m.value}>{m.label}</option>
                                            ))}
                                        </select>
                                    </div>

                                    {/* View Mode Buttons */}
                                    <div class="flex items-center bg-[#E8D4BC] p-1 rounded-xl border border-[#CFA07E]">
                                        <button 
                                            onClick={() => setActiveView('timeline')}
                                            class={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${activeView === 'timeline' ? 'bg-[#C1714F] text-white shadow' : 'text-[#5C2A14] hover:text-[#3B1F10]'}`}
                                        >
                                            <i class="fa-solid fa-table-columns"></i> Month Columns
                                        </button>
                                        <button 
                                            onClick={() => setActiveView('calendar')}
                                            class={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${activeView === 'calendar' ? 'bg-[#C1714F] text-white shadow' : 'text-[#5C2A14] hover:text-[#3B1F10]'}`}
                                        >
                                            <i class="fa-solid fa-calendar"></i> Month Grid
                                        </button>

                                </div>

                                {activeView === 'timeline' && (
                                    <div class="space-y-4">
                                        {/* Timeline Month Navigator Header */}
                                        <div class="flex items-center justify-between bg-[#E8D4BC]/60 border border-[#CFA07E] px-4 py-2.5 rounded-xl">
                                            <div class="flex items-center space-x-2">

                                                </button>

                                                    Showing {displayedTimelineMonths[0].label} – {displayedTimelineMonths[2].label}
                                                </span>
                                            </div>

                                            <div class="flex items-center space-x-2">
                                                <button 
                                                    onClick={() => setTimelineBaseDate(new Date('2026-09-01'))}

                                                >

                                        value={initials}
                                        onChange={(e) => setInitials(e.target.value)}
                                        placeholder="GL, SB, MW"
                                        class="w-full bg-white border border-[#CFA07E] rounded-xl px-3 py-2 text-xs text-[#3B1F10] focus:outline-none focus:border-[#C1714F]"
                                    />
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-[#5C2A14] mb-1">Notes / Next Steps</label>
                                <textarea 
                                    rows="3"
                                    value={notes}
                                    onChange={(e) => setNotes(e.target.value)}
                                    placeholder="Enter application progress, impact stories attached, review dates..."
                                    class="w-full bg-white border border-[#CFA07E] rounded-xl px-3 py-2 text-xs text-[#3B1F10] focus:outline-none focus:border-[#C1714F]"
                                ></textarea>
                            </div>

                            <div class="flex items-center justify-between pt-4 border-t border-[#E0C9AA]">
                                {grant?.id ? (
                                    <button 
                                        type="button"
                                        onClick={() => onDelete(grant.id)}
                                        class="bg-[#C1714F]/10 hover:bg-[#C1714F]/20 text-[#C1714F] text-xs font-bold px-4 py-2 rounded-xl transition border border-[#C1714F]/30"
                                    >
                                        Delete
                                    </button>
                                ) : (
                                    <div></div>
                                )}

                                <div class="flex items-center space-x-2">
                                    <button 
                                        type="button"
                                        onClick={onClose}
                                        class="bg-[#E8D4BC] hover:bg-[#E0C9AA] text-[#3B1F10] text-xs font-bold px-4 py-2 rounded-xl transition border border-[#CFA07E]"
                                    >
                                        Cancel
                                    </button>
                                    <button 
                                        type="submit"
                                        class="bg-[#C1714F] hover:bg-[#A85A38] text-white text-xs font-bold px-5 py-2 rounded-xl transition shadow-md"
                                    >
                                        Save Grant
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function BudgetModal({ item, onSave, onDelete, onClose }) {
            const [budgetItem, setBudgetItem] = useState(item?.item || '');
            const [category, setCategory] = useState(item?.category || 'Marketing');
            const [amount, setAmount] = useState(item?.amount || '');
            const [status, setStatus] = useState(item?.status || 'Pending');
            const [notes, setNotes] = useState(item?.notes || '');

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!budgetItem.trim()) return;
                onSave({
                    item: budgetItem,
                    category,
                    amount: Number(amount) || 0,
                    status,
                    notes
                });
            };

            return (
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#3B1F10]/50 backdrop-blur-sm">
                    <div class="bg-[#F7F1E8] border border-[#C1714F]/40 w-full max-w-md rounded-2xl p-6 shadow-2xl relative text-[#3B1F10]">
                        <button onClick={onClose} class="absolute top-4 right-4 text-[#5C2A14] hover:text-[#3B1F10]">
                            <i class="fa-solid fa-xmark text-lg"></i>
                        </button>

                        <h3 class="font-extrabold text-lg text-[#3B1F10] mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-wallet text-[#C1714F]"></i>
                            {item?.id ? 'Edit Budget Line Item' : 'Add Budget Line Item'}
                        </h3>

                        <form onSubmit={handleSubmit} class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-[#5C2A14] mb-1">Line Item Description *</label>
                                <input 
                                    type="text" 
                                    required
                                    value={budgetItem}
                                    onChange={(e) => setBudgetItem(e.target.value)}
                                    placeholder="e.g. SyeLabs Embroidered Caps & Swag"
                                    class="w-full bg-white border border-[#CFA07E] rounded-xl px-3 py-2 text-sm text-[#3B1F10] focus:outline-none focus:border-[#C1714F]"
                                />
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-bold text-[#5C2A14] mb-1">Category</label>
                                    <select 
                                        value={category}
                                        onChange={(e) => setCategory(e.target.value)}
                                        class="w-full bg-white border border-[#CFA07E] rounded-xl px-2.5 py-2 text-xs text-[#3B1F10] focus:outline-none"
                                    >
                                        <option value="Legal & Org">Legal & Org</option>
                                        <option value="Marketing">Marketing</option>
                                        <option value="Conferences">Conferences</option>
                                        <option value="Programs">Programs</option>
                                        <option value="Scaling">Scaling</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-[#5C2A14] mb-1">Estimated Cost ($)</label>
                                    <input 
                                        type="number" 
                                        required
                                        value={amount}
                                        onChange={(e) => setAmount(e.target.value)}
                                        placeholder="1200"
                                        class="w-full bg-white border border-[#CFA07E] rounded-xl px-3 py-2 text-xs text-[#3B1F10] focus:outline-none focus:border-[#C1714F]"
                                    />
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-[#5C2A14] mb-1">Approval Status</label>
                                <select 
                                    value={status}
                                    onChange={(e) => setStatus(e.target.value)}
                                    class="w-full bg-white border border-[#CFA07E] rounded-xl px-2.5 py-2 text-xs text-[#3B1F10] focus:outline-none"
                                >
                                    <option value="Planned">Planned</option>
                                    <option value="Pending">Pending Approval</option>
                                    <option value="Approved">Approved</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-[#5C2A14] mb-1">Notes / Vendor Info</label>
                                <input 
                                    type="text" 
                                    value={notes}
                                    onChange={(e) => setNotes(e.target.value)}
                                    placeholder="Order quote details, lead times..."
                                    class="w-full bg-white border border-[#CFA07E] rounded-xl px-3 py-2 text-xs text-[#3B1F10] focus:outline-none focus:border-[#C1714F]"
                                />
                            </div>

                            <div class="flex items-center justify-between pt-4 border-t border-[#E0C9AA]">
                                {item?.id ? (
                                    <button 
                                        type="button"
                                        onClick={() => onDelete(item.id)}
                                        class="bg-[#C1714F]/10 hover:bg-[#C1714F]/20 text-[#C1714F] text-xs font-bold px-4 py-2 rounded-xl transition border border-[#C1714F]/30"
                                    >
                                        Delete
                                    </button>
                                ) : (
                                    <div></div>
                                )}

                                <div class="flex items-center space-x-2">
                                    <button 
                                        type="button"
                                        onClick={onClose}
                                        class="bg-[#E8D4BC] hover:bg-[#E0C9AA] text-[#3B1F10] text-xs font-bold px-4 py-2 rounded-xl transition border border-[#CFA07E]"
                                    >
                                        Cancel
                                    </button>
                                    <button 
                                        type="submit"
                                        class="bg-[#C1714F] hover:bg-[#A85A38] text-white text-xs font-bold px-5 py-2 rounded-xl transition shadow-md"
                                    >
                                        Save Line Item
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<SyeLabsApp />);
    </script>
</body>
</html>
