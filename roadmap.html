        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import {
            getAuth, GoogleAuthProvider, signInWithPopup, signOut,
            onAuthStateChanged, setPersistence, browserLocalPersistence
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import {
            getFirestore, doc, onSnapshot, setDoc, getDoc
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ---------------------------------------------------------------------
        // SyeLabs Firebase configuration.
        //
        // Paste the config object from: Firebase console -> Project settings ->
        // Your apps -> Web app -> SDK setup and configuration -> Config.
        //
        // These values are NOT secrets - they ship in every Firebase web app and
        // are safe in public source. Who can actually read and write is decided
        // entirely by the allowlist in firestore.rules, which runs on Google's
        // servers and cannot be bypassed by editing this page.
        //
        // Leave the placeholders in place to keep running in local-storage mode.
        // ---------------------------------------------------------------------
        const SYELABS_FIREBASE_CONFIG = {
            apiKey:            "AIzaSyCOs6o-02mync43FeOKQRe7jTm8--O9cLc",
            authDomain:        "syelabsroadmap.firebaseapp.com",
            projectId:         "syelabsroadmap",
            storageBucket:     "syelabsroadmap.firebasestorage.app",
            messagingSenderId: "883039438397",
            appId:             "1:883039438397:web:1feb141b47b40755ef4c54",
            measurementId:     "G-0P9J046P8B"
        };

        const isConfigured = (cfg) =>
            cfg && typeof cfg.apiKey === 'string' && !cfg.apiKey.startsWith('PASTE_');

        // Injected config (artifact-style hosts) wins; otherwise the constant above.
        let resolvedConfig = null;
        if (typeof __firebase_config !== 'undefined') {
            try { resolvedConfig = JSON.parse(__firebase_config); } catch (e) { resolvedConfig = null; }
        } else if (isConfigured(SYELABS_FIREBASE_CONFIG)) {
            resolvedConfig = SYELABS_FIREBASE_CONFIG;
        }

        window.SyeLabsFB = {
            db: null,
            auth: null,
            user: null,
            appId: typeof __app_id !== 'undefined' ? __app_id : 'syelabs-master-hub',
            // The React app reads this to decide whether to show the sign-in gate
            // or fall back to the offline, local-storage-only experience.
            configured: !!resolvedConfig,

            // The Firestore functions, loaded here and handed over ready to use.
            //
            // The app lives in a text/babel script block, which Babel
            // Standalone compiles with its module transform - that rewrites a
            // dynamic import() into require(), and there is no require() in a
            // browser. So every attempt by the app to load this SDK itself threw
            // "require is not defined", which killed the snapshot listener and
            // every cloud write while leaving localStorage working. This script
            // is a real ES module, so its imports are native and simply work.
            fs: { doc, onSnapshot, setDoc, getDoc },

            init: function(onAuthChange) {
                if (!resolvedConfig) {
                    console.info(
                        'SyeLabs: no Firebase config set - running in local-storage mode. ' +
                        'Paste your config into SYELABS_FIREBASE_CONFIG to enable cloud sync.'
                    );
                    if (onAuthChange) onAuthChange(null);
                    return;
                }

                try {
                    const app  = initializeApp(resolvedConfig);

                    const db   = getFirestore(app);
                    const auth = getAuth(app);

                    window.SyeLabsFB.db = db;
                    window.SyeLabsFB.auth = auth;

                    // Keep the session across reloads so the team signs in once.
                    setPersistence(auth, browserLocalPersistence).catch((e) => {
                        console.warn('SyeLabs: could not set auth persistence:', e.message || e);
                    });

                    onAuthStateChanged(auth, (usr) => {
                        window.SyeLabsFB.user = usr || null;
                        if (onAuthChange) onAuthChange(usr || null);
                    });
                } catch (e) {
                    console.error('SyeLabs: Firebase init failed:', e.message || e);
                    if (onAuthChange) onAuthChange(null);
                }
            },

            signIn: async function() {
                const auth = window.SyeLabsFB.auth;
                if (!auth) throw new Error('Firebase is not configured.');
                const provider = new GoogleAuthProvider();
                // Always show the account chooser; several people share machines.
                provider.setCustomParameters({ prompt: 'select_account' });
                await signInWithPopup(auth, provider);
            },

            signOut: async function() {
                const auth = window.SyeLabsFB.auth;
                if (auth) await signOut(auth);
            }
        };
    </script>

        // Local-timezone date helpers.
        // Date#toISOString() reports UTC, so it rolls over to "tomorrow" during the
        // evening in western timezones. Likewise new Date('2026-09-01') parses as UTC
        // midnight, which is the previous day locally. Both must stay local-calendar.
        const toLocalISODate = (d = new Date()) => {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };

        // Builds a local Date from a 'YYYY-MM-DD' string without UTC drift.
        const localDateFromISO = (iso) => {
            const [y, m, d] = iso.split('-').map(Number);
            return new Date(y, m - 1, d);
        };

        // Renders a stored 'YYYY-MM-DD' value as 'Oct 15, 2026'. Goes through
        // localDateFromISO so the day never shifts backwards in western timezones.
        // Storage format is unchanged; this is display only.
        const formatDate = (iso, fallback = '\u2014') => {
            if (!iso) return fallback;
            const d = localDateFromISO(iso);
            if (Number.isNaN(d.getTime())) return iso;
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

                { title: 'Career Awareness & Exposure', desc: 'Connecting students to emerging technology fields, cloud infrastructure, and technical leadership opportunities.' },
                { title: 'HomeLabs & Technical Fluency', desc: 'Building practical hardware, ISO deployment, hypervisors, and open-source network curriculum ("It\'s All Connected").' },
                { title: 'Mentorship & Social Capital', desc: 'Facilitating organic 1-on-1 relationships between industry leaders, alumni fellows, and university interns.' },
                { title: 'Inclusion & Leadership Voice', desc: 'Representing diverse perspectives across technical workshops, conference panels, and organizational goals.' }
            ],
            roles: [
                { title: 'Council Co-Chairs (2 Roles)', tag: 'Leadership', desc: 'Recruiting and onboarding incoming council members, facilitating biweekly meetings, coordinating with advisor network, and monitoring central SyeLabs communications.' },
                { title: 'Career & Mentorship Catalyst', tag: 'Mentorship', desc: 'Designing initiatives to re-engage mid-career alumni, strengthening connections with Board of Directors, and building matrix-style career pipelines for fellows.' },
                { title: 'Programming & Workshop Lead', tag: 'Events', desc: 'Organizing minimum 3 events/workshops per year (including WWC NYC & State of Stack DC), drafting project roadmaps, venue/tech logistics, and participant feedback.' },
                { title: 'Treasurer & Financial Lead', tag: 'Finance', desc: 'Managing SyeLabs financial accounts, grant tracking ledger, merchandise budgeting (caps/giveaways), timesheet policies, and regular financial reporting.' }
            ],
            agreements: [
                'Time Commitment: Dedicated 3–5 hours per month to council duties and deliverables.',
                'Responsiveness: Acknowledge and respond to council communications within 24–48 hours.',
                'Term Limits: 2-year limit per specific role; 4-year maximum total council membership to ensure fresh perspective.',
                'Attendance Policy: Automatic review/dismissal after 3 consecutive unexcused meeting absences.'
            ],
            cadence: [
                'Biweekly Syncs: 1.5-hour biweekly Zoom meetings with defined facilitator, timekeeper, and note taker.',
                'Decision Voting: Internal council decisions determined by democratic majority vote.',
                'Action Items: Summarized at meeting close and distributed within 24 hours with agenda setting for next call.'
            ]
        };

        function SyeLabsApp() {
            const [planId] = useState('syelabs-master-plan');
            // True when sign-out was halted because an edit could not be saved.
            const [signOutBlocked, setSignOutBlocked] = useState(false);
            const [planTitle, setPlanTitle] = useState('SyeLabs Continuous Strategic Roadmap');
            const [startDate, setStartDate] = useState(() => toLocalISODate());
            
            // Core Navigation Tabs
            const [mainTab, setMainTab] = useState('plan'); // 'plan', 'grants', 'governance', 'curriculum'
            const [curriculumTrack, setCurriculumTrack] = useState('homelabs'); // 'homelabs', 'conferences', 'mentorship'

            // Data States
            const [events, setEvents] = useState(SYELABS_EVENTS);
            const [grants, setGrants] = useState(INITIAL_GRANTS);
            const [budgetItems, setBudgetItems] = useState(INITIAL_BUDGET);
            const [curriculumItems, setCurriculumItems] = useState(INITIAL_CURRICULUM);
            const [governance, setGovernance] = useState(DEFAULT_GOVERNANCE);
            const [totalBudgetCap, setTotalBudgetCap] = useState(15000);
            const [teamOwners, setTeamOwners] = useState(DEFAULT_TEAM_OWNERS);
            
            const [currentMonth, setCurrentMonth] = useState(new Date());
            const [timelineBaseDate, setTimelineBaseDate] = useState(() => localDateFromISO(PLAN_LAUNCH_DATE));
            const [activeView, setActiveView] = useState('timeline'); // 'timeline', 'calendar', 'list'
            
            // Modal states
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingEvent, setEditingEvent] = useState(null);
            
            const [isGrantModalOpen, setIsGrantModalOpen] = useState(false);
            const [editingGrant, setEditingGrant] = useState(null);

            const [isBudgetModalOpen, setIsBudgetModalOpen] = useState(false);
            const [editingBudget, setEditingBudget] = useState(null);

            const [isCurriculumModalOpen, setIsCurriculumModalOpen] = useState(false);
            const [editingCurriculum, setEditingCurriculum] = useState(null);

            const [isGovernanceModalOpen, setIsGovernanceModalOpen] = useState(false);

            // Filters
            const [filterSearch, setFilterSearch] = useState('');
            const [filterAssignee, setFilterAssignee] = useState('All');
            const [filterMonth, setFilterMonth] = useState('All');

            // Sync and notification states
            const [syncing, setSyncing] = useState(false);
            const [toast, setToast] = useState(null);

            // Whether the cloud is actually reachable, tracked separately for reads
            // and writes. The header badge used to claim "Synced" whenever a Firebase
            // config existed, so a browser whose every write was rejected looked
            // identical to a working one - edits piled up in localStorage and no one
            // found out until two people compared screens.
            //   read:  'unknown' | 'ok' | 'offline'
            //   write: 'unknown' | 'ok' | 'denied'  (rules rejected it) | 'failed' (network)
            const [cloudRead, setCloudRead] = useState('unknown');
            const [cloudWrite, setCloudWrite] = useState('unknown');
            // Last write status we already told the user about, so a debounced typing
            // session does not fire the same toast every 800ms.
            const reportedWriteRef = useRef('unknown');

            // Auth gate.
            //   'loading'  - resolving the persisted session
            //   'local'    - no Firebase config; offline local-storage mode
            //   'signedout'- needs Google sign-in
            //   'denied'   - signed in, but the allowlist in firestore.rules rejected them
            //   'ready'    - signed in and authorized
            const [authState, setAuthState] = useState('loading');
            const [authUser, setAuthUser] = useState(null);
            const [authError, setAuthError] = useState(null);

            const showToast = (msg, type = 'info') => {
                setToast({ msg, type });
                // A failed save is the one message worth reading twice; the cheerful
                // confirmations can keep flashing past at the old speed.
                setTimeout(() => setToast(null), type === 'error' ? 9000 : 3500);
            };

            // Applies a plan payload (from cache or Firestore) to component state.
            const applyPlanData = (data) => {
                if (!data) return;
                if (data.planTitle) setPlanTitle(data.planTitle);
                if (data.startDate) setStartDate(data.startDate);
                if (data.events) setEvents(data.events);
                if (data.grants) setGrants(data.grants);
                if (data.budgetItems) setBudgetItems(data.budgetItems);
                if (data.curriculumItems) setCurriculumItems(data.curriculumItems);
                if (data.governance) setGovernance(data.governance);
                if (data.totalBudgetCap !== undefined) setTotalBudgetCap(data.totalBudgetCap);
                if (data.teamOwners) setTeamOwners(data.teamOwners);
            };

            const loadLocalCache = () => {
                try {
                    const local = localStorage.getItem(`syelabs_plan_${planId}`);
                    if (local) applyPlanData(JSON.parse(local));
                } catch (e) {}
            };

            useEffect(() => {
                const FB = window.SyeLabsFB;

                // No Firebase config yet: offline mode, no gate, cache is all there is.
                if (!FB || !FB.configured) {
                    loadLocalCache();
                    setAuthState('local');
                    return;
                }

                FB.init((usr) => {
                    setAuthUser(usr);
                    if (usr) {
                        // 'verifying', not 'ready': any Google account can sign in, so
                        // a successful sign-in says nothing about authorization. This
                        // used to render the whole roadmap - including the baseline
                        // plan compiled into this page - to anyone with a Google
                        // account, and only ejected them if a permission-denied came
                        // back. A hung listener meant it never did. The first
                        // successful read is what promotes them to 'ready'.
                        setAuthState('verifying');
                        subscribeToPlanData(planId);
                    } else {
                        setAuthState('signedout');
                    }
                });
            }, [planId]);

            const handleSignIn = async () => {
                setAuthError(null);
                try {
                    await window.SyeLabsFB.signIn();
                } catch (e) {
                    const code = e && e.code ? e.code : '';
                    if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') {
                        return; // user backed out; not an error worth showing
                    }
                    setAuthError(
                        code === 'auth/popup-blocked'
                            ? 'Your browser blocked the sign-in popup. Allow popups for this site and try again.'
                            : code === 'auth/unauthorized-domain'
                                ? 'This domain is not authorized in Firebase. Add it under Authentication -> Settings -> Authorized domains.'
                                : (e.message || 'Sign-in failed.')
                    );
                }
            };

            // discardUnsaved is set only by the "Sign out anyway" escape hatch in
            // the warning below, which is the one path allowed to drop an edit.
            const handleSignOut = async (discardUnsaved = false) => {
                // A debounced edit still in its 800ms window would otherwise be
                // lost twice over: pushToCloud no-ops once the user is null, and
                // the local cache is cleared below. Land it while we still can.
                if (!discardUnsaved) {
                    let flushed;
                    try { flushed = await flushPendingSave(); } catch (e) { flushed = false; }
                    // undefined means there was nothing queued; false means the
                    // write genuinely failed and signing out now would lose it.
                    if (flushed === false) {
                        setSignOutBlocked(true);
                        return;
                    }
                }
                setSignOutBlocked(false);

                // Detach the snapshot listener FIRST. Signing out revokes the
                // credential, and a listener still attached at that moment fires
                // permission-denied, which would otherwise be misread as the
                // allowlist rejecting this account.
                if (unsubscribeRef.current) {
                    unsubscribeRef.current();
                    unsubscribeRef.current = null;
                }
                try {
                    // Do not leave organizational data cached on a shared machine.
                    localStorage.removeItem(`syelabs_plan_${planId}`);
                } catch (e) {}
                setAuthState('signedout');
                setAuthUser(null);
                setAuthError(null);
                try { await window.SyeLabsFB.signOut(); } catch (e) {}
            };

            const unsubscribeRef = useRef(null);
            // Only the first server response can be a conflict with work this
            // browser did while it was cut off; later ones are ordinary updates.
            const firstSnapshotRef = useRef(true);

            // If neither a read nor a write has landed a few seconds after the app
            // is up, the listener is hung rather than slow - report it instead of
            // leaving the badge on "Connecting" indefinitely.
            useEffect(() => {
                if (authState !== 'verifying') return;
                const t = setTimeout(() => {
                    console.error(
                        'SyeLabs: could not confirm access in 12s - Firestore never ' +
                        'answered. Failing closed. Usually a blocked connection to ' +
                        'firestore.googleapis.com (network, VPN, or an extension).'
                    );
                    setCloudRead('offline');
                    setAuthState('unverified');
                }, 12000);
                return () => clearTimeout(t);
            }, [authState]);

            // Firestore rejects a document containing `undefined` anywhere in it,
            // and it throws on the spot rather than returning an error - so a single
            // stray field silently blocks every save of the whole plan. Report the
            // exact path so it is fixable instead of mysterious.
            const findUndefined = (value, path = '') => {
                if (value === undefined) return path || '(root)';
                if (value === null || typeof value !== 'object') return null;
                if (Array.isArray(value)) {
                    for (let i = 0; i < value.length; i++) {
                        const hit = findUndefined(value[i], `${path}[${i}]`);
                        if (hit) return hit;
                    }
                    return null;
                }
                for (const k of Object.keys(value)) {
                    const hit = findUndefined(value[k], path ? `${path}.${k}` : k);
                    if (hit) return hit;
                }
                return null;
            };

            // One-line state dump for diagnosing sync problems from the console.
            useEffect(() => {
                // Runs the real save path and reports exactly why it fails.
                window.SyeLabsTestSave = async () => {
                    const payload = buildPlanPayload();
                    const bad = findUndefined(payload);
                    console.log('TESTSAVE payload keys:', Object.keys(payload).join(', '));
                    console.log('TESTSAVE size:', JSON.stringify(payload).length, 'bytes');
                    console.log('TESTSAVE undefined field:', bad || 'none');
                    console.log('TESTSAVE counts:', {
                        events: (payload.events || []).length,
                        grants: (payload.grants || []).length,
                        budgetItems: (payload.budgetItems || []).length,
                        curriculumItems: (payload.curriculumItems || []).length
                    });
                    const ok = await pushToCloud(payload);
                    console.log('TESTSAVE pushToCloud returned:', ok);
                    return ok;
                };

                // Upload the edits this browser made while it was cut off.
                window.SyeLabsPushLocal = async () => {
                    let cached = null;
                    try { cached = JSON.parse(localStorage.getItem(`syelabs_plan_${planId}`) || 'null'); } catch (e) {}
                    if (!cached) return console.error('SyeLabs: nothing cached in this browser.');
                    console.log('SyeLabs: uploading local copy from', cached.updatedAt);
                    const ok = await pushToCloud({ ...cached, updatedAt: new Date().toISOString() });
                    console.log(ok ? 'SyeLabs: uploaded - everyone can see it now.' : 'SyeLabs: upload failed, nothing was lost.');
                    return ok;
                };

                // Throw this browser's unsynced copy away and take the shared one.
                window.SyeLabsDiscardLocal = () => {
                    try { localStorage.removeItem(`syelabs_plan_${planId}`); } catch (e) {}
                    console.log('SyeLabs: local copy discarded. Reload to take the shared version.');
                };

                window.SyeLabsDebug = () => ({
                    authState,
                    cloudRead,
                    cloudWrite,
                    syncing,
                    signedInAs: window.SyeLabsFB.user ? window.SyeLabsFB.user.email : null,
                    configured: window.SyeLabsFB.configured,
                    hasDb: !!window.SyeLabsFB.db,
                    listenerAttached: !!unsubscribeRef.current,
                    docPath: `artifacts/${window.SyeLabsFB.appId}/public_data/plan_${planId}`,
                    localCacheBytes: (localStorage.getItem(`syelabs_plan_${planId}`) || '').length
                });
            }, [authState, cloudRead, cloudWrite, syncing, planId]);

            useEffect(() => {
                return () => {
                    if (unsubscribeRef.current) unsubscribeRef.current();
                };
            }, []);

            const subscribeToPlanData = (pId) => {
                const { db, appId } = window.SyeLabsFB;
                if (!db) {
                    // Firebase init threw earlier. Nothing will ever sync, so say so
                    // rather than sitting on "Connecting" forever.
                    console.error('SyeLabs: Firestore unavailable - Firebase never initialized.');
                    setCloudRead('offline');
                    return;
                }

                // onAuthStateChanged can fire more than once for a single sign-in.
                // Without this, each pass attached another snapshot listener and the
                // duplicates raced each other's seeding writes.
                if (unsubscribeRef.current) {
                    unsubscribeRef.current();
                    unsubscribeRef.current = null;
                }
                
                setSyncing(true);
                const fs = window.SyeLabsFB.fs;
                if (!fs) {
                    console.error('SyeLabs: Firestore functions unavailable - the module script did not run.');
                    setSyncing(false);
                    setCloudRead('offline');
                    return;
                }

                {
                    const docRef = fs.doc(db, 'artifacts', appId, 'public_data', `plan_${pId}`);

                    const unsubscribe = fs.onSnapshot(docRef, (snap) => {
                        setSyncing(false);
                        setCloudRead('ok');
                        // The read succeeded, so the rules accepted this account.
                        setAuthState('ready');
                        if (snap.exists()) {
                            const data = snap.data();

                            // Edits made while the cloud was unreachable live only in
                            // localStorage - they were never queued by Firestore,
                            // because the save threw before setDoc was reached. The
                            // first server response would overwrite that cache and
                            // destroy the work. If this browser holds something newer
                            // than the shared copy, keep it and let a person decide.
                            const wasFirst = firstSnapshotRef.current;
                            firstSnapshotRef.current = false;
                            let cached = null;
                            if (wasFirst) {
                                try { cached = JSON.parse(localStorage.getItem(`syelabs_plan_${pId}`) || 'null'); } catch (e) { cached = null; }
                            }
                            // Both timestamps are UTC ISO strings, so they compare directly.
                            const localIsNewer = cached && cached.updatedAt &&
                                (!data.updatedAt || cached.updatedAt > data.updatedAt);

                            if (localIsNewer) {
                                applyPlanData(cached);
                                console.warn(
                                    'SyeLabs: this browser holds edits from ' + cached.updatedAt +
                                    ', newer than the shared copy (' + (data.updatedAt || 'none') + '). ' +
                                    'They were never uploaded. Keeping them on screen and NOT ' +
                                    'overwriting them. Run SyeLabsPushLocal() to send them to the ' +
                                    'shared workspace, or reload after running SyeLabsDiscardLocal().'
                                );
                                showToast('This browser has unsynced edits newer than the shared copy - they have been kept, not uploaded. See the console.', 'error');
                            } else {
                                applyPlanData(data);
                                try { localStorage.setItem(`syelabs_plan_${pId}`, JSON.stringify(data)); } catch(e){}
                            }
                        } else {
                            // First run against an empty project: seed the document.
                            fs.setDoc(docRef, {
                                planTitle,
                                startDate,
                                events,
                                grants,
                                budgetItems,
                                curriculumItems,
                                governance,
                                totalBudgetCap,
                                teamOwners,
                                updatedAt: new Date().toISOString()
                            }).catch(err => {
                                console.warn("Firestore initial write notice:", err.message);
                                setCloudWrite(err.code === 'permission-denied' ? 'denied' : 'failed');
                            });
                        }
                    }, (err) => {
                        setSyncing(false);
                        // The allowlist lives in firestore.rules and is enforced by the
                        // server, so a rejected read is how we learn this account is not
                        // authorized. Anything else is a genuine connectivity problem.
                        if (err.code === 'permission-denied') {
                            console.warn('SyeLabs: Firestore rejected the read (rules).', err.message);
                            try { localStorage.removeItem(`syelabs_plan_${pId}`); } catch(e){}
                            setCloudRead('offline');
                            // Only a signed-in account can be denied. With no user
                            // this is the tail of a sign-out, not a rejection.
                            if (window.SyeLabsFB.user) {
                                setAuthState('denied');
                            }
                        } else {
                            console.warn("Firestore snapshot unavailable:", err.message);
                            setCloudRead('offline');
                            showToast('Offline - changes are saved locally', 'info');
                        }
                    });

                    unsubscribeRef.current = unsubscribe;
                }
            };

            const buildPlanPayload = (updatedEvents, updatedGrants, updatedBudget, updatedCurriculum, newTitle, newStartDate, newBudgetCap, newOwners, updatedGovernance) => ({
                planTitle: newTitle !== undefined ? newTitle : planTitle,
                startDate: newStartDate !== undefined ? newStartDate : startDate,
                events: updatedEvents !== undefined ? updatedEvents : events,
                grants: updatedGrants !== undefined ? updatedGrants : grants,
                budgetItems: updatedBudget !== undefined ? updatedBudget : budgetItems,
                curriculumItems: updatedCurriculum !== undefined ? updatedCurriculum : curriculumItems,
                governance: updatedGovernance !== undefined ? updatedGovernance : governance,
                totalBudgetCap: newBudgetCap !== undefined ? newBudgetCap : totalBudgetCap,
                teamOwners: newOwners !== undefined ? newOwners : teamOwners,
                updatedAt: new Date().toISOString()
            });

            const persistLocal = (payload) => {
                try {
                    localStorage.setItem(`syelabs_plan_${planId}`, JSON.stringify(payload));
                } catch (e) {}
            };

            // Resolves true only if the write actually landed in Firestore.
            // Callers that just fire-and-forget can keep ignoring the result.
            const pushToCloud = async (payload) => {
                const { db, appId, user } = window.SyeLabsFB;
                if (!db || !user) return false;

                const markWritten = () => {
                    setCloudWrite('ok');
                    if (reportedWriteRef.current !== 'ok') {
                        // Recovered after a stretch of local-only edits.
                        if (reportedWriteRef.current === 'denied' || reportedWriteRef.current === 'failed') {
                            showToast('Back online - your edits are in the shared workspace.', 'success');
                        }
                        reportedWriteRef.current = 'ok';
                    }
                };

                try {
                    setSyncing(true);
                    const fs = window.SyeLabsFB.fs;
                    const docRef = fs.doc(db, 'artifacts', appId, 'public_data', `plan_${planId}`);
                    const write = fs.setDoc(docRef, {
                        ...payload,
                        lastUpdatedBy: user.uid
                    }, { merge: true });

                    // Firestore queues writes while it is offline and leaves this
                    // promise pending - not rejected - until the server acknowledges.
                    // Awaiting it alone parked the badge on "Syncing" forever, which
                    // read as "in progress" when nothing was moving. Give the spinner
                    // a deadline. The write itself is deliberately left running: the
                    // SDK still delivers it on reconnect, so the edit is not dropped.
                    const PENDING_MS = 8000;
                    const outcome = await Promise.race([
                        write.then(() => 'ok', (e) => e),
                        new Promise(r => setTimeout(() => r('pending'), PENDING_MS))
                    ]);

                    if (outcome === 'pending') {
                        console.warn('SyeLabs: write still unacknowledged after 8s - queued for reconnect.');
                        setCloudWrite('failed');
                        if (reportedWriteRef.current !== 'failed') {
                            reportedWriteRef.current = 'failed';
                            showToast('Cannot reach the shared workspace. Your edit is queued and will send when the connection returns.', 'error');
                        }
                        // Report it if the queued write does eventually land.
                        write.then(markWritten).catch(() => {});
                        return false;
                    }
                    if (outcome !== 'ok') throw outcome;

                    markWritten();
                    return true;
                } catch (e) {
                    console.error("SyeLabs: cloud save failed (kept in this browser only):", e && e.code, e && e.message || e);
                    // An invalid document is rejected locally by the SDK before any
                    // network call. Reporting that as "could not reach the workspace"
                    // sent us looking at rules and connectivity for a data problem.
                    const bad = findUndefined(payload);
                    if (bad) {
                        console.error(
                            `SyeLabs: the plan contains an undefined value at "${bad}". ` +
                            'Firestore refuses the whole document for this, so every save ' +
                            'fails until that field has a real value.'
                        );
                    }
                    // permission-denied means the server rules rejected this account,
                    // which no amount of retrying fixes - it needs a rules change.
                    const state = e && e.code === 'permission-denied' ? 'denied' : 'failed';
                    setCloudWrite(state);
                    if (reportedWriteRef.current !== state) {
                        reportedWriteRef.current = state;
                        showToast(
                            state === 'denied'
                                ? 'Not saved to the shared workspace: your account is not allowed to write. Edits are in this browser only.'
                                : 'Could not reach the shared workspace. Edits are in this browser only.',
                            'error'
                        );
                    }
                    return false;
                } finally {
                    setSyncing(false);
                }
            };

            // Discrete actions (saving a modal, deleting a row) push immediately.
            const savePlanToCloud = async (...args) => {
                const payload = buildPlanPayload(...args);
                persistLocal(payload);
                await pushToCloud(payload);
            };

            // Free-text and number inputs fire on every keystroke. Each cloud write
            // rewrites the whole ~13 KB document, so typing a 50-character title
            // used to cost 50 writes. localStorage still updates on every keystroke
            // - only the Firestore write waits for a pause in typing.
            const CLOUD_SAVE_DEBOUNCE_MS = 800;
            const pendingSaveRef = useRef({ timer: null, payload: null });

            const flushPendingSave = () => {
                const pending = pendingSaveRef.current;
                if (pending.timer) {
                    clearTimeout(pending.timer);
                    pending.timer = null;
                }
                if (pending.payload) {
                    const payload = pending.payload;
                    pending.payload = null;
                    // Returned so callers that must not race the write - sign-out
                    // above all - can await it. Fire-and-forget callers ignore it.
                    return pushToCloud(payload).then(ok => {
                        // A failed write goes back on the queue, so "Try again"
                        // in the sign-out warning has something left to send.
                        if (!ok && !pending.payload) pending.payload = payload;
                        return ok;
                    });
                }
            };

            const savePlanDebounced = (...args) => {
                const payload = buildPlanPayload(...args);
                persistLocal(payload);              // instant; survives a refresh

                const pending = pendingSaveRef.current;
                pending.payload = payload;
                if (pending.timer) clearTimeout(pending.timer);
                pending.timer = setTimeout(() => {
                    pending.timer = null;
                    const p = pending.payload;
                    pending.payload = null;
                    if (p) pushToCloud(p);
                }, CLOUD_SAVE_DEBOUNCE_MS);
            };

            // Do not lose a pending write if the tab closes mid-pause.
            useEffect(() => {
                const onHide = () => {
                    const pending = pendingSaveRef.current;
                    if (pending.timer) flushPendingSave();
                };
                window.addEventListener('beforeunload', onHide);
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'hidden') onHide();
                });
                return () => {
                    window.removeEventListener('beforeunload', onHide);
                    flushPendingSave();
                };
            }, []);

            const handleSaveGovernance = (newGov) => {
                setGovernance(newGov);
                savePlanToCloud(events, grants, budgetItems, curriculumItems, planTitle, startDate, totalBudgetCap, teamOwners, newGov);
                showToast('Governance Charter updated!', 'success');
                setIsGovernanceModalOpen(false);
            };

            const handleAddTeamOwner = (newOwner) => {
                if (!newOwner || teamOwners.includes(newOwner)) return;
                const updated = [...teamOwners, newOwner];
                setTeamOwners(updated);
                savePlanToCloud(events, grants, budgetItems, curriculumItems, planTitle, startDate, totalBudgetCap, updated);
                showToast(`New team owner "${newOwner}" added!`, 'success');
            };

            // Removing an owner only edits the roster of chips. Tasks already
            // assigned to them keep their assignee text, so nothing is silently
            // lost — the toast reports how many still reference the name.
            const handleDeleteTeamOwner = (owner) => {
                const updated = teamOwners.filter(o => o !== owner);
                if (updated.length === teamOwners.length) return;
                setTeamOwners(updated);
                savePlanToCloud(events, grants, budgetItems, curriculumItems, planTitle, startDate, totalBudgetCap, updated);
                const stillUsed = events.filter(e =>
                    e.assignee && e.assignee.split(',').map(a => a.trim()).includes(owner)
                ).length;
                showToast(
                    stillUsed
                        ? `Removed "${owner}" — ${stillUsed} task${stillUsed > 1 ? 's' : ''} still list them.`
                        : `Owner "${owner}" removed.`,
                    'success'
                );
            };

            // Renaming does propagate into tasks: the name still means the same
            // person, so every assignee referencing it is rewritten.
            const handleRenameTeamOwner = (oldName, newName) => {
                const next = newName.trim();
                if (!next || next === oldName) return;
                if (teamOwners.includes(next)) {
                    showToast(`"${next}" is already on the list.`, 'info');
                    return;
                }
                const updatedOwners = teamOwners.map(o => (o === oldName ? next : o));
                const updatedEvents = events.map(evt => {
                    if (!evt.assignee) return evt;
                    const list = evt.assignee.split(',').map(a => a.trim()).filter(Boolean);
                    if (!list.includes(oldName)) return evt;
                    return { ...evt, assignee: list.map(a => (a === oldName ? next : a)).join(', ') };
                });
                setTeamOwners(updatedOwners);
                setEvents(updatedEvents);
                savePlanToCloud(updatedEvents, grants, budgetItems, curriculumItems, planTitle, startDate, totalBudgetCap, updatedOwners);
                showToast(`Renamed "${oldName}" to "${next}".`, 'success');
            };

            // Calculate current 3 displayed months for timeline
            const displayedTimelineMonths = useMemo(() => {
                const months = [];
                for (let i = 0; i < 3; i++) {
                    const d = new Date(timelineBaseDate.getFullYear(), timelineBaseDate.getMonth() + i, 1);
                    const yearMonthStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                    const label = d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
                    months.push({ date: d, yearMonthStr, label });
                }
                return months;
            }, [timelineBaseDate]);

            // Filtered events
            const filteredEvents = useMemo(() => {
                return events.filter(evt => {
                    const evtYearMonth = evt.date ? evt.date.substring(0, 7) : '';
                    const matchSearch = evt.title.toLowerCase().includes(filterSearch.toLowerCase()) || 
                                        (evt.description && evt.description.toLowerCase().includes(filterSearch.toLowerCase())) ||
                                        (evt.category && evt.category.toLowerCase().includes(filterSearch.toLowerCase()));
                    
                    const evtAssignees = evt.assignee ? evt.assignee.split(',').map(a => a.trim()) : [];
                    const matchAssignee = filterAssignee === 'All' || evtAssignees.includes(filterAssignee) || evt.assignee === filterAssignee;
                    const matchMonth = filterMonth === 'All' || evtYearMonth === filterMonth;
                    
                    return matchSearch && matchAssignee && matchMonth;
                });
            }, [events, filterSearch, filterAssignee, filterMonth]);

            const assigneesList = useMemo(() => {
                const list = new Set(teamOwners);
                events.forEach(e => {
                    if (e.assignee) {
                        e.assignee.split(',').forEach(a => list.add(a.trim()));
                    }
                });
                return ['All', ...Array.from(list)];
            }, [events, teamOwners]);

            const availableMonthsList = useMemo(() => {
                const set = new Set();
                events.forEach(e => {
                    if (e.date) set.add(e.date.substring(0, 7));
                });
                const arr = Array.from(set).sort();
                return arr.map(ym => {
                    const [y, m] = ym.split('-');
                    const dateObj = new Date(Number(y), Number(m) - 1, 1);
                    return {
                        value: ym,
                        label: dateObj.toLocaleDateString('en-US', { month: 'short', year: 'numeric' })
                    };
                });
            }, [events]);

            // Grant calculations. Declined applications are excluded from the pipeline
            // so the headline number reflects money still realistically in play.
            const grantPipeline = useMemo(() => {
                return grants
                    .filter(g => g.status !== 'Declined')
                    .reduce((acc, g) => acc + (Number(g.amount) || 0), 0);
            }, [grants]);

            const grantAwarded = useMemo(() => {
                return grants
                    .filter(g => g.status === 'Awarded')
                    .reduce((acc, g) => acc + (Number(g.amount) || 0), 0);
            }, [grants]);

            const declinedCount = useMemo(() => {
                return grants.filter(g => g.status === 'Declined').length;
            }, [grants]);

            const activeGrantCount = useMemo(() => {
                return grants.filter(g => g.status === 'Submitted' || g.status === 'Under Review').length;
            }, [grants]);

            // Budget calculations
            const totalCostsOverall = useMemo(() => {
                return budgetItems.reduce((acc, b) => acc + (Number(b.amount) || 0), 0);
            }, [budgetItems]);

            const totalRemainingBudget = useMemo(() => {
                return totalBudgetCap - totalCostsOverall;
            }, [totalBudgetCap, totalCostsOverall]);

            const handleSaveEvent = (eventData) => {
                let updated;
                if (editingEvent && editingEvent.id) {
                    updated = events.map(e => e.id === editingEvent.id ? { ...editingEvent, ...eventData } : e);
                    showToast('Milestone updated successfully!', 'success');
                } else {
                    const newEvt = { ...eventData, id: 'evt-' + Date.now() };
                    updated = [...events, newEvt];
                    showToast('New milestone added!', 'success');
                }
                setEvents(updated);
                savePlanToCloud(updated, grants, budgetItems, curriculumItems, planTitle, startDate, totalBudgetCap, teamOwners);
                setIsModalOpen(false);
                setEditingEvent(null);
            };

            const handleDeleteEvent = (id) => {
                const updated = events.filter(e => e.id !== id);
                setEvents(updated);
                savePlanToCloud(updated, grants, budgetItems, curriculumItems, planTitle, startDate, totalBudgetCap, teamOwners);
                showToast('Milestone removed', 'info');
                setIsModalOpen(false);
                setEditingEvent(null);
            };

            const handleSaveGrant = (grantData) => {
                let updated;
                if (editingGrant && editingGrant.id) {
                    updated = grants.map(g => g.id === editingGrant.id ? { ...editingGrant, ...grantData } : g);
                    showToast('Grant updated successfully!', 'success');
                } else {
                    const newG = { ...grantData, id: 'g-' + Date.now() };
                    updated = [...grants, newG];
                    showToast('New grant tracked!', 'success');
                }
                setGrants(updated);
                savePlanToCloud(events, updated, budgetItems, curriculumItems, planTitle, startDate, totalBudgetCap, teamOwners);
                setIsGrantModalOpen(false);
                setEditingGrant(null);
            };

            const handleDeleteGrant = (id) => {
                const updated = grants.filter(g => g.id !== id);
                setGrants(updated);
                savePlanToCloud(events, updated, budgetItems, curriculumItems, planTitle, startDate, totalBudgetCap, teamOwners);
                showToast('Grant removed', 'info');
                setIsGrantModalOpen(false);
                setEditingGrant(null);
            };

            const handleSaveBudget = (budgetData) => {
                let updated;
                if (editingBudget && editingBudget.id) {
                    updated = budgetItems.map(b => b.id === editingBudget.id ? { ...editingBudget, ...budgetData } : b);
                    showToast('Budget line item updated!', 'success');
                } else {
                    const newB = { ...budgetData, id: 'b-' + Date.now() };
                    updated = [...budgetItems, newB];
                    showToast('New budget item added!', 'success');
                }
                setBudgetItems(updated);
                savePlanToCloud(events, grants, updated, curriculumItems, planTitle, startDate, totalBudgetCap, teamOwners);
                setIsBudgetModalOpen(false);
                setEditingBudget(null);
            };

            const handleDeleteBudget = (id) => {
                const updated = budgetItems.filter(b => b.id !== id);
                setBudgetItems(updated);
                savePlanToCloud(events, grants, updated, curriculumItems, planTitle, startDate, totalBudgetCap, teamOwners);
                showToast('Budget item removed', 'info');
                setIsBudgetModalOpen(false);
                setEditingBudget(null);
            };

            const handleSaveCurriculum = (curriculumData) => {
                let updated;
                if (editingCurriculum && editingCurriculum.id) {
                    updated = curriculumItems.map(c => c.id === editingCurriculum.id ? { ...editingCurriculum, ...curriculumData } : c);
                    showToast('Curriculum item updated!', 'success');
                } else {
                    const newC = { ...curriculumData, id: 'curr-' + Date.now() };
                    updated = [...curriculumItems, newC];
                    showToast('New curriculum item added!', 'success');
                }
                setCurriculumItems(updated);
                savePlanToCloud(events, grants, budgetItems, updated, planTitle, startDate, totalBudgetCap, teamOwners);
                setIsCurriculumModalOpen(false);
                setEditingCurriculum(null);
            };

            const handleDeleteCurriculum = (id) => {
                const updated = curriculumItems.filter(c => c.id !== id);
                setCurriculumItems(updated);
                savePlanToCloud(events, grants, budgetItems, updated, planTitle, startDate, totalBudgetCap, teamOwners);
                showToast('Curriculum item removed', 'info');
                setIsCurriculumModalOpen(false);
                setEditingCurriculum(null);
            };

            const handleExportICS = () => {
                // RFC 5545: backslash, semicolon, comma and newlines must be escaped in
                // text values, and lines longer than 75 octets must be folded.
                const escapeICS = (text) => String(text ?? '')
                    .replace(/\\/g, '\\\\')
                    .replace(/;/g, '\\;')
                    .replace(/,/g, '\\,')
                    .replace(/\r?\n/g, '\\n');

                const foldICS = (line) => {
                    if (line.length <= 75) return line;
                    const parts = [line.slice(0, 75)];
                    let rest = line.slice(75);
                    while (rest.length > 74) {
                        parts.push(' ' + rest.slice(0, 74));
                        rest = rest.slice(74);
                    }
                    if (rest) parts.push(' ' + rest);
                    return parts.join('\r\n');
                };

                const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';

                let icsContent = [
                    'BEGIN:VCALENDAR',
                    'VERSION:2.0',
                    'PRODID:-//SyeLabs//Roadmap Calendar//EN',
                    'CALSCALE:GREGORIAN',
                    'METHOD:PUBLISH'
                ];

                events.forEach(evt => {
                    if (!evt.date) return;
                    const dateClean = evt.date.replace(/-/g, '');
                    // All-day events use a non-inclusive DTEND, so it is the next day.
                    const next = localDateFromISO(evt.date);
                    next.setDate(next.getDate() + 1);
                    const dateEnd = toLocalISODate(next).replace(/-/g, '');

                    icsContent.push('BEGIN:VEVENT');
                    icsContent.push(`UID:${evt.id}@syelabs.com`);
                    icsContent.push(`DTSTAMP:${stamp}`);
                    icsContent.push(`DTSTART;VALUE=DATE:${dateClean}`);
                    icsContent.push(`DTEND;VALUE=DATE:${dateEnd}`);
                    icsContent.push(foldICS(`SUMMARY:[SyeLabs] ${escapeICS(evt.title)}`));
                    icsContent.push(foldICS(
                        'DESCRIPTION:' + escapeICS(
                            `Category: ${evt.category} | Priority: ${evt.priority || 'N/A'} | ` +
                            `Owners: ${evt.assignee || 'Unassigned'} | Deliverable: ${evt.deliverable || 'N/A'}` +
                            (evt.description ? `\n\n${evt.description}` : '')
                        )
                    ));
                    icsContent.push(foldICS(`STATUS:${evt.status === 'Completed' ? 'CONFIRMED' : 'TENTATIVE'}`));
                    icsContent.push('END:VEVENT');
                });

                icsContent.push('END:VCALENDAR');
                const blob = new Blob([icsContent.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
                const url = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.setAttribute('download', 'syelabs-roadmap.ics');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast('Calendar exported (.ics file)!', 'success');
            };

            // ---- Auth gate -------------------------------------------------
            // Rendered instead of the app until the account is known and authorized.
            if (authState === 'loading' || authState === 'verifying') {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="text-center">
                            <i className="fa-solid fa-spinner fa-spin text-3xl text-[#C1714F]"></i>
                            <p className="text-sm font-bold text-[#5C2A14] mt-4">Checking your access…</p>
                        </div>
                    </div>
                );
            }

            if (authState === 'signedout' || authState === 'denied' || authState === 'unverified') {
                const denied = authState === 'denied' || authState === 'unverified';
                const unverified = authState === 'unverified';
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="glass-panel rounded-2xl p-8 sm:p-10 max-w-md w-full text-center">
                            <div className="w-16 h-16 rounded-2xl bg-[#3B1F10] flex items-center justify-center p-2 mx-auto mb-5 border border-[#C1714F]">
                                <i className={`fa-solid ${denied ? 'fa-lock' : 'fa-vial-virus'} text-2xl text-[#F2E8D9]`}></i>
                            </div>

                            <h1 className="syelabs-brand-heading leading-tight">SYELABS</h1>
                            <p className="text-2xs text-[#98573b] font-semibold tracking-wider uppercase mb-6">
                                Strategic Roadmap &amp; Operations Hub
                            </p>

                            {denied ? (
                                <>
                                    <h2 className="text-lg font-extrabold text-[#3B1F10] mb-2">
                                        {unverified ? "Couldn't confirm your access" : "You don't have access"}
                                    </h2>
                                    <p className="text-xs text-[#5C2A14] leading-relaxed mb-6">
                                        {unverified ? (
                                            <>Couldn&apos;t reach the SyeLabs workspace to check whether{' '}
                                            {authUser?.email ? <strong className="font-bold">{authUser.email}</strong> : 'this account'}{' '}
                                            is on the allowlist, so access is refused until it can. Check your
                                            connection and reload - a VPN or privacy extension blocking
                                            firestore.googleapis.com is the usual cause.</>
                                        ) : (
                                            <>{authUser?.email
                                                ? <><strong className="font-bold">{authUser.email}</strong> is not on the SyeLabs allowlist. </>
                                                : 'This account is not on the SyeLabs allowlist. '}
                                            Ask a council co-chair to add this address, then sign in again.</>
                                        )}
                                    </p>
                                    <button
                                        onClick={() => handleSignOut()}
                                        className="w-full bg-[#E8D4BC] hover:bg-[#E0C9AA] text-[#3B1F10] text-xs font-bold px-4 py-2.5 rounded-xl transition border border-[#CFA07E]"
                                    >
                                        Try a different account
                                    </button>
                                </>
                            ) : (
                                <>
                                    <h2 className="text-lg font-extrabold text-[#3B1F10] mb-2">Team sign-in required</h2>
                                    <p className="text-xs text-[#5C2A14] leading-relaxed mb-6">
                                        Sign in with your approved Google account to continue.
                                    </p>
                                    <button
                                        onClick={handleSignIn}
                                        className="w-full bg-[#C1714F] hover:bg-[#A85A38] text-white text-sm font-bold px-4 py-3 rounded-xl transition shadow-md flex items-center justify-center gap-2"
                                    >
                                        <i className="fa-brands fa-google"></i> Sign in with Google
                                    </button>
                                </>
                            )}

                            {authError && (
                                <p className="text-2xs text-red-700 bg-red-50 border border-red-200 rounded-lg p-2.5 mt-4 text-left leading-relaxed">
                                    {authError}
                                </p>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-16">
                    {/* Toast notification */}
                    {toast && (
                        <div className={`fixed bottom-5 right-5 z-50 px-5 py-3 rounded-xl text-xs font-bold shadow-2xl flex items-center space-x-2 transition-all ${
                            toast.type === 'success' ? 'bg-[#C1714F] text-white'
                                : toast.type === 'error' ? 'bg-[#B03A2E] text-white'
                                : 'bg-[#3B1F10] text-[#F7F1E8]'
                        }`}>
                            <i className={`fa-solid ${
                                toast.type === 'success' ? 'fa-circle-check'
                                    : toast.type === 'error' ? 'fa-triangle-exclamation'
                                    : 'fa-circle-info'
                            }`}></i>
                            <span>{toast.msg}</span>
                        </div>
                    )}

                    {/* Top Branding Bar */}
                    <header className="bg-[#F2E8D9] border-b border-[#E0C9AA] sticky top-0 z-30 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-col sm:flex-row items-center justify-between gap-4">
                            
                            {/* Brand Logo and Title */}
                            <div className="flex items-center space-x-3">
                                <div className="w-11 h-11 rounded-2xl bg-[#3B1F10] flex items-center justify-center p-1.5 shadow-md shrink-0 border border-[#C1714F]">
                                    <img 
                                        src="https://syelabs.com/wp-content/uploads/2023/11/cropped-SyeLabs-Logo-1.png" 
                                        alt="SyeLabs Logo" 
                                        className="w-full h-full object-contain"
                                        onError={(e) => {
                                            e.target.onerror = null;
                                            e.target.style.display = 'none';
                                            e.target.parentNode.innerHTML = '<i class="fa-solid fa-vial-virus text-[#F2E8D9] text-xl"></i>';
                                        }}
                                    />
                                </div>

                                <div>
                                    <h1 className="syelabs-brand-heading leading-tight">SYELABS</h1>
                                    <p className="text-2xs text-[#98573b] font-semibold tracking-wider uppercase">
                                        Continuous Strategic Roadmap & Operations Hub
                                    </p>
                                </div>
                            </div>

                            {/* Header Actions */}
                            <div className="flex items-center space-x-2 sm:space-x-3">
                                {syncing ? (
                                    <span className="text-xs text-[#98573b] font-bold flex items-center gap-1 bg-[#E8D4BC] px-2.5 py-1 rounded-lg whitespace-nowrap">
                                        <i className="fa-solid fa-spinner fa-spin"></i> Syncing
                                    </span>
                                ) : authState === 'local' ? (
                                    <span
                                        className="text-xs text-[#5C2A14] font-bold flex items-center gap-1 bg-[#E8D4BC]/60 px-2.5 py-1 rounded-lg border border-[#CFA07E]/40 whitespace-nowrap"
                                        title="No Firebase config set - edits are saved to this browser only"
                                    >
                                        <i className="fa-solid fa-hard-drive text-[#C1714F]"></i> Local only
                                    </span>
                                ) : cloudWrite === 'denied' ? (
                                    <span
                                        className="text-xs text-white font-bold flex items-center gap-1 bg-[#B03A2E] px-2.5 py-1 rounded-lg border border-[#8C2D22] whitespace-nowrap"
                                        title="Your account is signed in and can read the plan, but the Firestore rules reject its writes. Edits are saved in this browser only and nobody else will see them. Add this address to allowedEmails() in firestore.rules and republish."
                                    >
                                        <i className="fa-solid fa-triangle-exclamation"></i> Not saving
                                    </span>
                                ) : cloudWrite === 'failed' || cloudRead === 'offline' ? (
                                    <span
                                        className="text-xs text-[#5C2A14] font-bold flex items-center gap-1 bg-[#E8D4BC] px-2.5 py-1 rounded-lg border border-[#B03A2E]/50 whitespace-nowrap"
                                        title="Cannot reach the shared workspace. Edits are saved in this browser only until the connection comes back."
                                    >
                                        <i className="fa-solid fa-cloud-slash text-[#B03A2E]"></i> Offline
                                    </span>
                                ) : cloudWrite === 'ok' || cloudRead === 'ok' ? (
                                    <span
                                        className="text-xs text-[#5C2A14] font-bold flex items-center gap-1 bg-[#E8D4BC]/60 px-2.5 py-1 rounded-lg border border-[#CFA07E]/40 whitespace-nowrap"
                                        title="Synced to the shared SyeLabs workspace"
                                    >
                                        <i className="fa-solid fa-cloud-arrow-up text-[#C1714F]"></i> Synced
                                    </span>
                                ) : (
                                    <span
                                        className="text-xs text-[#5C2A14] font-bold flex items-center gap-1 bg-[#E8D4BC]/60 px-2.5 py-1 rounded-lg border border-[#CFA07E]/40 whitespace-nowrap"
                                        title="Still establishing the connection to the shared workspace"
                                    >
                                        <i className="fa-solid fa-cloud text-[#98573b]"></i> Connecting
                                    </span>
                                )}

                                {authUser && (
                                    <div className="flex items-center gap-2 bg-[#E8D4BC]/60 border border-[#CFA07E]/40 pl-1 pr-2 py-1 rounded-lg">
                                        {authUser.photoURL ? (
                                            <img
                                                src={authUser.photoURL}
                                                alt=""
                                                className="w-6 h-6 rounded-md object-cover"
                                                referrerPolicy="no-referrer"
                                            />
                                        ) : (
                                            <span className="w-6 h-6 rounded-md bg-[#C1714F] text-white text-2xs font-extrabold flex items-center justify-center">
                                                {(authUser.displayName || authUser.email || '?').charAt(0).toUpperCase()}
                                            </span>
                                        )}
                                        <span className="text-2xs font-bold text-[#3B1F10] hidden sm:inline max-w-[140px] truncate" title={authUser.email}>
                                            {authUser.displayName || authUser.email}
                                        </span>
                                        <button
                                            onClick={() => handleSignOut()}
                                            title="Sign out"
                                            className="text-[#98573b] hover:text-[#3B1F10] transition px-1"
                                        >
                                            <i className="fa-solid fa-right-from-bracket text-xs"></i>
                                        </button>
                                    </div>
                                )}

                                <button 
                                    onClick={handleExportICS}
                                    className="bg-[#E8D4BC] hover:bg-[#E0C9AA] text-[#3B1F10] text-xs font-bold px-3.5 py-2 rounded-xl border border-[#CFA07E] transition flex items-center gap-1.5"
                                    title="Export Calendar to Google / Outlook"
                                >
                                    <i className="fa-solid fa-file-export text-[#C1714F]"></i> Export .ICS
                                </button>
                            </div>
                        </div>

                        {/* Navigation Tabs Bar */}
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center space-x-1 sm:space-x-2 overflow-x-auto py-2 border-t border-[#E0C9AA]/60">
                            <button 
                                onClick={() => setMainTab('plan')}
                                className={`px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 whitespace-nowrap ${
                                    mainTab === 'plan' ? 'bg-[#3B1F10] text-[#F7F1E8] shadow' : 'text-[#5C2A14] hover:bg-[#E8D4BC]/60'
                                }`}
                            >
                                <i className="fa-solid fa-calendar-days text-[#C1714F]"></i> Monthly Roadmap
                            </button>

                            <button 
                                onClick={() => setMainTab('grants')}
                                className={`px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 whitespace-nowrap ${
                                    mainTab === 'grants' ? 'bg-[#3B1F10] text-[#F7F1E8] shadow' : 'text-[#5C2A14] hover:bg-[#E8D4BC]/60'
                                }`}
                            >
                                <i className="fa-solid fa-wallet text-[#C1714F]"></i> Budget & Grants Ledger
                            </button>

                            <button 
                                onClick={() => setMainTab('governance')}
                                className={`px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 whitespace-nowrap ${
                                    mainTab === 'governance' ? 'bg-[#3B1F10] text-[#F7F1E8] shadow' : 'text-[#5C2A14] hover:bg-[#E8D4BC]/60'
                                }`}
                            >
                                <i className="fa-solid fa-landmark text-[#C1714F]"></i> Governance & Charter
                            </button>

                            <button 
                                onClick={() => setMainTab('curriculum')}
                                className={`px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 whitespace-nowrap ${
                                    mainTab === 'curriculum' ? 'bg-[#3B1F10] text-[#F7F1E8] shadow' : 'text-[#5C2A14] hover:bg-[#E8D4BC]/60'

        function EventModal({ event, teamOwners, onAddOwner, onDeleteOwner, onRenameOwner, onSave, onDelete, onClose }) {
            useEscapeToClose(onClose);
            const [title, setTitle] = useState(event?.title || '');
            const [date, setDate] = useState(event?.date || toLocalISODate());
            const [category, setCategory] = useState(event?.category || 'Legal & Org');
            const [priority, setPriority] = useState(event?.priority || 'High');
            const [assignee, setAssignee] = useState(event?.assignee || '');
            const [description, setDescription] = useState(event?.description || '');
            const [deliverable, setDeliverable] = useState(event?.deliverable || '');
            const [status, setStatus] = useState(event?.status || 'To Do');
            const [newCustomOwner, setNewCustomOwner] = useState('');
            const [editingOwner, setEditingOwner] = useState(null);
            const [editingValue, setEditingValue] = useState('');

            const selectedOwners = useMemo(() => {
                return assignee ? assignee.split(',').map(a => a.trim()).filter(Boolean) : [];
            }, [assignee]);

            const toggleOwner = (owner) => {
                let updated;
                if (selectedOwners.includes(owner)) {
                    updated = selectedOwners.filter(o => o !== owner);
                } else {
                    updated = [...selectedOwners, owner];
                }
                setAssignee(updated.join(', '));
            };

            const handleCreateOwner = (e) => {
                e.preventDefault();
                if (!newCustomOwner.trim()) return;
                onAddOwner(newCustomOwner.trim());
                toggleOwner(newCustomOwner.trim());
                setNewCustomOwner('');
            };

            const startRename = (owner) => {
                setEditingOwner(owner);
                setEditingValue(owner);
            };

            const cancelRename = () => {
                setEditingOwner(null);
                setEditingValue('');
            };

            // Committing unmounts the input, which fires onBlur a second time.
            // The editingOwner guard makes that repeat call a no-op.
            const commitRename = () => {
                if (!editingOwner) return;
                const target = editingOwner;
                const next = editingValue.trim();
                cancelRename();
                if (!next || next === target) return;
                onRenameOwner(target, next);
                // The parent rewrites saved tasks; this modal's own draft
                // assignee is local state, so it needs the same swap.
                if (selectedOwners.includes(target)) {
                    setAssignee(selectedOwners.map(o => (o === target ? next : o)).join(', '));
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!title.trim()) return;
                onSave({
                    title,
                    date,
                    category,
                    priority,
                    assignee,
                    description,
                    deliverable,
                    status
                });

                                        <option value="Content">Content</option>

                                </label>

                                        const isSel = selectedOwners.includes(owner);

                                        if (editingOwner === owner) {
                                            return (
                                                <input
                                                    key={owner}
                                                    autoFocus
                                                    type="text"
                                                    value={editingValue}
                                                    onChange={(e) => setEditingValue(e.target.value)}
                                                    onBlur={commitRename}
                                                    onKeyDown={(e) => {
                                                        // Enter would otherwise submit the surrounding task form.
                                                        if (e.key === 'Enter') { e.preventDefault(); commitRename(); }
                                                        else if (e.key === 'Escape') { e.preventDefault(); cancelRename(); }
                                                    }}
